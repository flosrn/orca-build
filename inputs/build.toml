# Orca v1.4.215. netcup-vie builds the desktop .deb, which U6 qualifies after these gates. The Mac app
# builds unsigned on the hosted runner, whose loopback is its own, so its native network gates run there;
# the operator Mac signs it with Orca Dev and verifies each bundle's designated requirement (ADR 0014).
[upstream]
repository = "stablyai/orca"
tagScheme = "v{version}"

[platforms.linux-x64]
host = "netcup-vie"
[platforms.linux-x64.toolchain]
node = "24.21.0"
pnpm = "12.0.0"
[[platforms.linux-x64.dependencies]]
manager = "pnpm"
lockfile = "pnpm-lock.yaml"
# mobile/ is its own pnpm project (upstream .github/actions/install-mobile-dependencies): the root
# install leaves mobile/node_modules empty and `build:mobile-web` cannot resolve React Native or
# Expo. Its postinstall generates source the bundle imports, so it runs with scripts.
[[platforms.linux-x64.dependencies]]
manager = "pnpm"
cwd = "mobile"
lockfile = "pnpm-lock.yaml"
# `build:linux` spelled out step by step: upstream's `typecheck` sizes its parallel tsc batch by
# os.totalmem() (the host's 31 GB, not the job's cgroup), so all three projects (15 GiB of heap)
# ran at once and the job slice was OOM-killed at 12G and again at 18G (2026-10-03). Run in
# sequence, the peak is one project's.
[[platforms.linux-x64.steps]]
id = "typecheck-node"
argv = ["pnpm", "run", "typecheck:node"]
[[platforms.linux-x64.steps]]
id = "typecheck-web"
argv = ["pnpm", "run", "typecheck:web"]
[[platforms.linux-x64.steps]]
id = "typecheck-cli"
argv = ["pnpm", "run", "typecheck:cli"]
[[platforms.linux-x64.steps]]
id = "relay"
argv = ["pnpm", "run", "build:relay"]
[[platforms.linux-x64.steps]]
id = "cli"
argv = ["pnpm", "run", "build:cli"]
[[platforms.linux-x64.steps]]
id = "electron-vite"
argv = ["pnpm", "run", "build:electron-vite"]
[[platforms.linux-x64.steps]]
id = "skills-cli"
argv = ["pnpm", "run", "verify:built-skills-cli"]
[[platforms.linux-x64.steps]]
id = "web"
argv = ["pnpm", "run", "build:web-from-renderer"]
[[platforms.linux-x64.steps]]
id = "mobile-web"
argv = ["pnpm", "run", "build:mobile-web"]
[[platforms.linux-x64.steps]]
id = "electron-runtime"
argv = ["pnpm", "run", "ensure:electron-runtime"]
[[platforms.linux-x64.steps]]
# build-linux-local.mjs runs `electron-builder --linux AppImage deb rpm --x64`; the release ships only the deb
# (the one declared artifact), and rpm would need rpmbuild. Same command, deb alone, never publishing.
id = "desktop"
argv = ["pnpm", "exec", "electron-builder", "--config", "config/electron-builder.config.cjs", "--linux", "deb", "--x64", "--publish", "never"]
[[platforms.linux-x64.steps]]
id = "renderer-boot"
argv = ["node", "config/scripts/verify-renderer-boot-graph.mjs"]
[[platforms.linux-x64.artifacts]]
id = "desktop"
path = "dist/orca-linux-x64.deb"
kind = "native"

[platforms.macos-arm64]
runner = { repository = "flosrn/orca-build", label = "macos-15" }
[platforms.macos-arm64.toolchain]
node = "24.21.0"
pnpm = "12.0.0"
[[platforms.macos-arm64.dependencies]]
manager = "pnpm"
lockfile = "pnpm-lock.yaml"
[[platforms.macos-arm64.dependencies]]
manager = "pnpm"
cwd = "mobile"
lockfile = "pnpm-lock.yaml"
[[platforms.macos-arm64.steps]]
id = "desktop"
argv = ["pnpm", "run", "build:mac"]
[[platforms.macos-arm64.steps]]
id = "renderer-boot"
argv = ["node", "config/scripts/verify-renderer-boot-graph.mjs"]
[[platforms.macos-arm64.artifacts]]
id = "desktop"
path = "dist/orca-macos-arm64.zip"
kind = "native-zip"

